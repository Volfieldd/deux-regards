# Chaîne DS23 : une saisie malveillante ou un fichier piégé (DS11, DS13) puis, dans la même heure, une sortie refusée par
# le mandataire ou rejetée par l'hôte (dans un sens ou dans l'autre) : le code envoyé tourne peut-être et cherche à
# sortir. Les constats « bas » (HTML inoffensif d'un billet, BV-12) n'y entrent pas.
title: Saisie malveillante ou fichier piégé (pour la chaîne réseau)
name: reseau_attaque_site
id: f7b39a5d-fa17-42e5-9f2f-c89e4ad4a949
author: Nicephos (Vigie)
logsource: { product: nicephos, service: vigie }
generate: false
detection:
  saisie:
    type: malicious_input
    severity: [moyen, haut, critique]
  fichier:
    type: upload_rejected
  condition: 1 of them
level: low
vigie: { signal: false }
