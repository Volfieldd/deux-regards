# BV-19 — Téléchargement en masse (seuls les seuils et les archives émettent : une ligne par photo ferait du volume)
title: Limite de téléchargements ou d'archives d'un accès atteinte (siphonage)
name: telechargements_en_masse
id: f68ea402-176d-42fc-96a7-681fbdee3464
author: Nicephos (Vigie)
logsource: { product: nicephos, service: vigie }
description: >-
  Le site émet à la 51e photo téléchargée en 1 h par un accès, ou à la 4e archive du jour (3 par jour, G46) : une
  invitée ordinaire n'y arrive pas (48 photos dans une galerie type, une archive suffit).
tags: [attack.collection, attack.exfiltration, attack.t1530]
detection:
  selection:
    type: excess_rate_limit_exceeded
    detail.portail: galerie_privee
    detail.limite: [telechargements, archives]
  condition: selection
level: medium
vigie: { cas: DS15, entite: { kind: site, champ: detail.acces, prefixe: 'acces:' }, source_unique: true, mode: alerter }
