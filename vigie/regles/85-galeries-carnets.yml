  Une consultation hors portée reste dans exploration_droits (10 en 10 minutes, DS10) ; une écriture ne vient pas d'un
  clic (logique de DS12), elle ouvre l'alerte d'elle-même. Émetteurs : routes/carnet.js, routes/galeries.js,
