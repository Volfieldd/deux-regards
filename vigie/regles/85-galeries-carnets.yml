logsource: { product: nicephos, service: vigie }
description: >-
  Le site refuse déjà ; l'alerte dit que l'accès retiré est encore tenté, souvent signe d'une fuite à instruire
  (procédure de violation, docs/wiki/RGPD.md § 4). Gravité de l'événement : « haut » quand réseau et navigateur
  diffèrent de l'entrée d'origine. cookie_rejoue (10-preuves.yml) exige un sub : il ne la double pas.
tags: [attack.credential_access, attack.t1539, attack.t1550.004]
detection:
  selection:
    type: session_use_after_expire
    composant: site · public
    detail.portail: galerie_privee
  condition: selection
level: medium
vigie: { cas: DS1, entite: { kind: site, champ: detail.acces, prefixe: 'acces:', sinon: galerie_privee }, source_unique: true, gravite: evenement, mode: alerter }
