title: Nouvel appareil sur un accès puis téléchargement en masse dans l'heure
name: acces_nouvel_appareil_puis_siphonage
id: ab7eb5f4-fb31-4732-b168-5ec932099020
author: Nicephos (Vigie)
logsource: { product: nicephos, service: vigie }
description: >-
  Corrélation de BV-18 et BV-19. « Nouveau réseau » n'est pas dans l'événement (le site n'envoie qu'un réseau par
  entrée) : le site dit le nouvel appareil, et le premier appareil d'un accès n'en est pas un (c'est l'invitée qui
  arrive). Une archive seule n'y entre pas : ouvrir sur le téléphone puis télécharger l'archive sur l'ordinateur est le
  parcours ordinaire ; seule une limite atteinte compte.
tags: [attack.collection, attack.exfiltration, attack.t1530, attack.t1078]
correlation:
  type: temporal
  rules: [galerie_nouvel_appareil, telechargements_en_masse]
  group-by: [detail.acces]
  timespan: 1h
level: high
vigie: { cas: DS18, entite: { kind: site, champ: detail.acces, prefixe: 'acces:' }, source_unique: true, mode: alerter }
---
