title: Billets en ligne réécrits ou retirés en série par un compte (défacement, 3 en 1 h)
name: billets_modifies_en_masse
id: fac02f39-7835-4758-99ab-252f682a21fd
author: Nicephos (Vigie)
logsource: { product: nicephos, service: vigie }
description: >-
  Un geste du site (detail.objet textes_publics) compte une fois, quel que soit le nombre de champs ou de langues qu'il
  change : on compte les événements distincts (champ id), pas detail.nombre, qui pèserait une traduction en trois langues
  comme trois billets. Deux billets par mois sont annoncés (D17). Une publication programmée (sub nul) n'est rattachée à
  aucun compte.
tags: [attack.impact, attack.t1491.001]
correlation:
  type: value_count
  rules: [billet_en_ligne_change]
  group-by: [sub]
  timespan: 1h
  condition: { gte: 3, field: id }
level: medium
vigie: { cas: DS9, entite: { kind: compte, champ: sub }, source_unique: true, mode: alerter }
