# Galeries privées et Carnets (registre des briques, docs/etudes/vigie-besoins-des-briques.md : BV-12, BV-14, BV-16 à
# BV-19, BV-21 pour les billets, BV-22, BV-23, BV-25 ; décisions du propriétaire, section « Tranché », qui l'emportent).
# Événements tels que les émettent les PR #149 (galeries privées : server/routes/prive.js, server/routes/galeries.js,
# server/spaces.js) et #151 (Carnets : server/routes/carnet.js, server/carnet-markdown.js).
#   - Un invité n'est jamais un compte (G4) : ses règles groupent par detail.acces (l'accès, son numéro), par ip ou par
#     reference (« visiteur:<12 signes> », identité technique de la session visiteur), jamais par sub.
#   - Une alerte sur un accès vise l'entité « site » de clé « acces:<numéro> » (préfixe de l'entité, vigie/sigma.js).
#   - Mode « alerter » partout le premier mois (Tranché 5) ; acces_pays_multiples porte une réponse automatique
#     (suspendre_acces), appliquée quand on la passera en mode « bloquer ». Seule exception : billet_apres_session_reprise,
#     en mode « bloquer » avec la réponse douce verifier_identite (décision du propriétaire du 19 octobre 2026, hors du
#     périmètre du Tranché 5, qui vise les accès des galeries).

