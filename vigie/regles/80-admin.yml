---
title: Écritures de l'admin tentées en série sans confirmer l'identité demandée
name: ecritures_sans_identite
id: dec826f9-7e38-4b7e-b3c0-8681ef972826
author: Nicephos (Vigie)
logsource: { product: nicephos, service: vigie }
description: >-
  La Vigie a redemandé l'identité du compte et une session authentifiée d'avant tente 5 écritures différentes en 15 minutes
  sans la confirmer : la personne légitime confirme après une ou deux (l'enregistrement automatique d'un billet reste une
  seule route) ; un voleur de cookie de session ne le peut pas et essaie ailleurs. Alerte haute : geler le compte se décide
  à la main.
tags: [attack.credential_access, attack.t1539, attack.defense_evasion, attack.t1550.004]
correlation:
  type: value_count
  rules: [ecriture_sans_identite]
  group-by: [sub]
  timespan: 15m
  condition: { gte: 5, field: route }
level: high
vigie: { cas: DS2, entite: { kind: compte, champ: sub }, source_unique: true, mode: alerter }
