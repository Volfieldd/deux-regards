title: Réglage public changé dans l'heure qui suit une session reprise depuis un autre appareil
name: reglage_apres_session_reprise
id: 330be0bf-00e6-4275-99af-8809e958cf4a
author: Nicephos (Vigie)
logsource: { product: nicephos, service: vigie }
tags: [attack.persistence, attack.impact, attack.t1078]
correlation:
  type: temporal
  rules: [session_autre_appareil, reglage_public]
  group-by: [sub]
  timespan: 1h
level: high
# Une écriture a suivi la reprise : la même réponse douce que session_autre_appareil (verifier_identite), qui arrête
# les écritures suivantes ; rien de plus si l'identité a été confirmée après la reprise (vigie/moteur.js).
vigie: { cas: DS23, entite: { kind: compte, champ: sub }, source_unique: true, mode: bloquer, reponse: verifier_identite }
---
# Textes publiés (BV-20, BV-21) : émis par server/securite/textes-publics.js après chaque écriture de l'admin et chaque
# publication programmée (sub nul : entité « site »).
