# Vérification d'identité (décision verifier_identite, 19 octobre 2026) : écritures de l'admin arrêtées par le site tant
# que la session n'a pas confirmé son identité (authz_reauth_required, une fois par minute, par session et par route).
title: Écriture de l'admin arrêtée, identité à confirmer
name: ecriture_sans_identite
id: 74df444e-b7a1-4a9b-82f9-57054001971b
author: Nicephos (Vigie)
logsource: { product: nicephos, service: vigie }
