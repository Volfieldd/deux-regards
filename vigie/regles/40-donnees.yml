title: Messages de la boîte Contact effacés en masse par un compte (10 en 1 h)
name: messages_effaces_en_masse
id: 44213e3f-0bd7-4dc3-8a48-5073662405c1
author: Nicephos (Vigie)
logsource: { product: nicephos, service: vigie }
description: >-
  10 messages distincts supprimés en 1 h par un même compte (registre BV-30, DS18) : un compte volé qui détruit des
  messages (la trace d'un hameçonnage, des demandes de retrait). Une suppression distincte est le couple objet et
  numéro : un message supprimé deux fois (double envoi du formulaire) compte une fois. La boîte reçoit au plus 30
  notifications par jour (BV-29) et quelques messages par semaine en temps ordinaire, triés un par un : 10 en une heure
  n'arrive guère qu'après une vague de pourriels, d'où le mode Alerter, sans réponse automatique. Propre aux messages :
  un autre objet effacé aurait son volume, donc son seuil, et sa corrélation.
tags: [attack.impact, attack.t1485, attack.stealth, attack.t1070]
correlation:
  type: value_count
  rules: [message_supprime]
  group-by: [sub]
  timespan: 1h
  condition: { gte: 10, field: [detail.objet, detail.id] }
level: medium
vigie: { cas: DS18, entite: { kind: compte, champ: sub }, source_unique: true, mode: alerter }
