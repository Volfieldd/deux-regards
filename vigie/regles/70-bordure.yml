# Bordure Cloudflare (phase C3, décision D19) : constats du Worker, lus dans Analytics Engine. Source « bordure » du
# quorum : avec le site (pages introuvables, pièges, saisies) ou Zitadel sur la même adresse, une alerte s'ouvre.
title: Rafale de réponses 4xx vue en bordure (exploration, énumération)
name: bordure_erreurs
id: 1b3a6778-26d8-47fb-8931-bcecef461f73
author: Nicephos (Vigie)
logsource: { product: nicephos, service: vigie }
tags: [attack.reconnaissance, attack.t1595.003]
detection:
  selection:
    type: bordure_erreurs
  condition: selection
level: medium
# Les mêmes réponses 4xx que le site signale déjà (rafales de 404, pièges) : contexte, jamais une seconde source du
# quorum (arbitrage NC3-1). La bordure fait le quorum par ce que le site ne voit pas (rafales de pages, opérateurs).
vigie: { cas: DS16, entite: { kind: ip, champ: ip }, points: 2, contexte: true }
