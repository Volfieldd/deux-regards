# Preuves à source unique (décision D18) : une seule observation suffit, alerte immédiate sans quorum.
# Modes de départ (D3) : DS1 et DS8 hors du mois d'observation ; les preuves DS8 sans réponse possible (administrateur
# donné, journal des comptes, sauvegarde) et la chaîne rompue (DS20) en « alerter » : notifiées, jamais muettes.
title: Rôle donné, retiré ou compte changé hors de l'application
name: role_hors_application
id: 7eb3ad9a-4b84-5996-bca3-667469c7fbfe
author: Nicephos (Vigie)
logsource: { product: nicephos, service: vigie }
description: Changement de compte noté par la base sans ticket signé de l'application (outil SQL, injection, restauration, faux ticket).
tags: [attack.persistence, attack.privilege_escalation, attack.t1098]
detection:
  selection:
    type: [privilege_permissions_changed, user_created, user_deleted, user_rescued]
    detail.hors_application: true
  condition: selection
level: critical
vigie: { cas: DS8, entite: { kind: compte, champ: detail.compte }, source_unique: true, mode: bloquer, reponse: geler_et_revoquer, nature_dossier: preuve }
