# Déploiement : site + sauvegarde quotidienne, et en option le tunnel Cloudflare.
#   docker compose up -d --build                 # site + sauvegardes
#   docker compose --profile tunnel up -d        # + cloudflared (TUNNEL_TOKEN dans .env)
#   docker compose --profile traduction up -d    # + LibreTranslate (TRANSLATE_URL=http://libretranslate:5000 dans .env)
#
# DONNÉES : DATA_DIR et BACKUP_DIR sont des dossiers de l'hôte (bind mounts), à créer avant le premier
# lancement. Compose refuse de démarrer s'ils manquent (pas de dossier vide créé en silence) et
# « docker compose down -v » ne peut pas les effacer. Voir docs/wiki/Déploiement.md.

x-data: &data
  type: bind
  source: ${DATA_DIR:?DATA_DIR obligatoire (dossier des données sur l'hôte)}
  target: /data
  bind:
    create_host_path: false

x-logging: &logging
  # Journaux Docker bornés (ils contiennent des adresses IP tronquées et les pages vues) : 3 × 10 Mo par conteneur.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  site:
    build: .
    image: site-photo:latest
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      STORAGE_DIR: /data
      DATABASE_PATH: /data/site.db
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - *data
    # Par défaut, le site n'écoute que sur la machine : cloudflared le joint par le réseau Docker.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    stop_grace_period: 60s
    logging: *logging
    mem_limit: 3g                     # un original de 120 Mpx décodé pèse ~0,5 Go
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  backup:
    image: site-photo:latest
    restart: unless-stopped
    depends_on:
      site:
        condition: service_healthy
    # Pas de .env : la sauvegarde n'a besoin d'aucun secret (cookies, OIDC, Instagram, tunnel).
    environment:
      STORAGE_DIR: /data
      DATABASE_PATH: /data/site.db
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      REQUIRE_PERSISTENT_STORAGE: "1"
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: ["node", "server/db/backup.js", "--loop"]
    healthcheck:
      disable: true
    logging: *logging
    mem_limit: 512m
    volumes:
      - *data
      - type: bind
        source: ${BACKUP_DIR:?BACKUP_DIR obligatoire (dossier des sauvegardes sur l'hôte)}
        target: /backups
        bind:
          create_host_path: false
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [tunnel]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}   # obligatoire pour le profil « tunnel » (cloudflared refuse de démarrer sans)
    depends_on:
      site:
        condition: service_healthy
    logging: *logging
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Propositions de traduction dans l'admin (profil « traduction ») : sur place, aucun texte ne sort du serveur.
  # Premier lancement : téléchargement unique des modèles français, anglais et allemand (~300 Mo, gardés dans le volume).
  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    profiles: [traduction]
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: fr,en,de
      LT_DISABLE_WEB_UI: "true"
    logging: *logging
    mem_limit: 2g
    pids_limit: 256
    volumes:
      - traduction-modeles:/home/libretranslate/.local
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  traduction-modeles:
