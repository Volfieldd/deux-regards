# Nicephos sur Unraid (plugin « Docker Compose Manager »).
# Quatre conteneurs : le site, la sauvegarde quotidienne, le tunnel Cloudflare (HTTPS, aucun port ouvert) et le
# traducteur LibreTranslate (propositions de traduction dans l'admin, sur place : aucun texte ne sort du serveur).
# Facultatifs, par profil (COMPOSE_PROFILES dans le .env) : « vigie » (la Vigie et sa sauvegarde), « signal » (la
# passerelle Signal de ses alertes).
# Réglages dans le fichier .env de la pile (modèle : env.example). Guide : README.md.
#
# DOSSIERS : tout se déduit de deux réglages du .env.
#   NICEPHOS_DIR  data/ (site), vigie/ et vigie-secrets/ (Vigie), signal/ (passerelle) ; chacun monté seul :
#                 le site ne voit que data/, jamais la base ni les secrets de la Vigie.
#   BACKUP_DIR    sauvegardes du site ; celles de la Vigie vont dans « BACKUP_DIR-vigie », à côté.
# DATA_DIR, VIGIE_DATA_DIR, VIGIE_SECRETS_DIR, SIGNAL_DATA_DIR et VIGIE_BACKUP_DIR restent possibles pour forcer un
# chemin. Les dossiers doivent exister AVANT le premier lancement (propriétaires : README.md, étape 2). Compose refuse
# de démarrer s'ils manquent : jamais de dossier vide créé en silence.

name: nicephos

x-data: &data
  type: bind
  source: ${DATA_DIR:-${NICEPHOS_DIR:?NICEPHOS_DIR obligatoire (voir env.example)}/data}
  target: /data
  bind:
    create_host_path: false

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

x-logging: &logging
  # Journaux Docker bornés (ils contiennent des adresses IP tronquées et les pages vues) : 3 × 10 Mo par conteneur.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Réseau dédié à adresses fixes : le site ne fait confiance à X-Forwarded-For que venant du tunnel
# (un poste du réseau local ne peut donc pas se faire passer pour un autre visiteur). Les autres conteneurs reçoivent
# une adresse de la moitié haute (ip_range) : aucun ne peut prendre celle du tunnel (TUNNEL_IP, hors de cette plage).
networks:
  nicephos:
    ipam:
      config:
        - subnet: ${NET_SUBNET:-172.29.42.0/24}
          ip_range: ${NET_IP_RANGE:-172.29.42.128/25}
  # Vigie (facultative) : réseau sans sortie vers Internet entre le site et la Vigie (envoi des événements, lecture des
  # décisions). Sans le profil « vigie », il existe mais personne n'y écoute.
  vigie-ingest:
    name: nicephos-vigie-ingest
    internal: true
    ipam:
      config:
        - subnet: ${VIGIE_NET_SUBNET:-172.29.43.0/24}
          ip_range: ${VIGIE_NET_IP_RANGE:-172.29.43.128/25}
  # Passerelle Signal de la Vigie (profil « signal ») : réseau sans sortie vers Internet entre la Vigie et la passerelle,
  # dont l'API n'a aucune authentification ; le site n'y est pas. Sans le profil « signal », il existe mais reste vide.
  vigie-signal:
    name: nicephos-vigie-signal
    internal: true
  # Sortie vers les serveurs de Signal, pour la passerelle seule (ni le site ni la Vigie n'y sont).
  signal-sortie: {}

services:
  site:
    image: ${IMAGE:-ghcr.io/volfieldd/deux-regards:latest}
    container_name: nicephos
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      STORAGE_DIR: /data
      DATABASE_PATH: /data/site.db
      REQUIRE_PERSISTENT_STORAGE: "1"
      TRUST_PROXY: ${TUNNEL_IP:-172.29.42.10}
      # Le jeton du tunnel ne sert qu'à cloudflared : jamais transmis au site, qui traite des fichiers reçus.
      TUNNEL_TOKEN: ""
      # Traducteur de la pile (vide dans le .env pour retirer le bouton « Proposer une traduction »).
      TRANSLATE_URL: ${TRANSLATE_URL-http://libretranslate:5000}
    user: "${PUID:-99}:${PGID:-100}"
    networks: [nicephos, vigie-ingest]
    logging: *logging
    # Mémoire du site : un original de 120 Mpx décodé pèse ~0,5 Go. Descriptions « Précis » (Florence-2 large,
    # ~4 Go pendant le calcul, dans ce conteneur) : SITE_MEM_LIMIT=6g dans le .env ; « Léger » tient dans 3g.
    mem_limit: ${SITE_MEM_LIMIT:-3g}
    pids_limit: 256
    volumes:
      - *data
    # Accès depuis le réseau local (contrôle) ; Internet passe par le tunnel, pas par ce port.
    ports:
      - "${LAN_PORT:-3080}:3000"
    stop_grace_period: 60s
    <<: *hardening
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:3080]/"

  backup:
    image: ${IMAGE:-ghcr.io/volfieldd/deux-regards:latest}
    container_name: nicephos-sauvegarde
    restart: unless-stopped
    depends_on:
      site:
        condition: service_healthy
    # Pas de .env : la sauvegarde n'a besoin d'aucun secret.
    environment:
      NODE_ENV: production
      STORAGE_DIR: /data
      DATABASE_PATH: /data/site.db
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_DELETED_DAYS: ${BACKUP_DELETED_DAYS:-90}
      REQUIRE_PERSISTENT_STORAGE: "1"
    user: "${PUID:-99}:${PGID:-100}"
    command: ["node", "server/db/backup.js", "--loop"]
    # Santé : « unhealthy » dans l'onglet Docker si la dernière sauvegarde date de plus de deux intervalles, a échoué,
    # ou a trouvé une base sans photo (voir last.json).
    healthcheck:
      test: ["CMD", "node", "server/db/backup.js", "--etat"]
      interval: 15m
      timeout: 30s
      start_period: 2h
      retries: 2
    networks: [nicephos]
    logging: *logging
    mem_limit: 512m
    volumes:
      - *data
      - type: bind
        source: ${BACKUP_DIR:?BACKUP_DIR obligatoire (voir env.example)}
        target: /backups
        bind:
          create_host_path: false
    <<: *hardening

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    container_name: nicephos-tunnel
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN obligatoire (Cloudflare Zero Trust → Tunnels)}
    depends_on:
      site:
        condition: service_healthy
    networks:
      nicephos:
        ipv4_address: ${TUNNEL_IP:-172.29.42.10}
    logging: *logging
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Propositions de traduction (anglais, allemand) dans l'admin. Joignable seulement par le site (réseau de la pile,
  # aucun port publié). Premier lancement : télécharge une fois ses modèles français, anglais et allemand (~300 Mo,
  # gardés dans le volume) ; ensuite tout se fait hors ligne.
  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    container_name: nicephos-traduction
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: fr,en,de
      LT_DISABLE_WEB_UI: "true"
    networks: [nicephos]
    logging: *logging
    mem_limit: 2g
    pids_limit: 256
    volumes:
      - traduction-modeles:/home/libretranslate/.local
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  # ---------- Vigie : journalisation de sécurité, FACULTATIVE (docs/wiki/Vigie.md) ----------
  # Ne démarre qu'avec le profil « vigie » (Compose Up avec --profile vigie, ou COMPOSE_PROFILES=vigie dans le .env).
  # Secrets dans vigie.env (à côté de ce fichier), jamais dans le .env du site. Base dans VIGIE_DATA_DIR, à part.
  vigie:
    image: ${VIGIE_IMAGE:-ghcr.io/volfieldd/deux-regards-vigie:latest}
    container_name: nicephos-vigie
    profiles: [vigie]
    restart: unless-stopped
    env_file:
      - path: vigie.env
        required: false
    environment:
      VIGIE_DATA_DIR: /data
      VIGIE_INGEST_PORT: 4100
      # La réception n'écoute que sur le réseau interne (adresse fixe) : ni le tunnel ni les autres conteneurs ne la
      # joignent. Le site l'appelle par son nom sur ce réseau : VIGIE_URL=http://vigie-reception:4100.
      VIGIE_HOST: ${VIGIE_INGEST_IP:-172.29.43.10}
      VIGIE_ZITADEL_KEY_FILE: /secrets/zitadel.json
      # Sauvegardes du site, en lecture seule, OBLIGATOIRES : contrôle des rôles chaque heure (un site compromis ne
      # réécrit pas une sauvegarde déjà faite par le conteneur de sauvegarde). Sans elles, la Vigie refuse de démarrer.
      VIGIE_SITE_BACKUP_DIR: /sauvegardes-site
      # Console (phase D3, facultative : ouverte par VIGIE_CONSOLE_CLIENT_ID dans vigie.env) : n'écoute que sur son adresse
      # fixe du réseau du tunnel ; le nom public vigie.nicephos.art y mène (Cloudflare Access devant, jeton vérifié ici).
      VIGIE_CONSOLE_HOST: ${VIGIE_CONSOLE_IP:-172.29.42.20}
      VIGIE_CONSOLE_PORT: 4200
      VIGIE_CONSOLE_SECRET_FILE: /secrets/console-secret
    user: "${PUID:-99}:${PGID:-100}"
    # vigie-ingest : le site seul la joint ; nicephos : sortie vers Zitadel et console derrière le tunnel (adresse fixe,
    # hors de la plage des adresses données automatiquement).
    networks:
      vigie-ingest:
        ipv4_address: ${VIGIE_INGEST_IP:-172.29.43.10}
        aliases: [vigie-reception]
      nicephos:
        ipv4_address: ${VIGIE_CONSOLE_IP:-172.29.42.20}
      # Notifications Signal (phase D) : la passerelle n'a aucun port publié, seule la Vigie la joint ici.
      vigie-signal: {}
    volumes:
      - type: bind
        source: ${VIGIE_DATA_DIR:-${NICEPHOS_DIR:?NICEPHOS_DIR obligatoire (voir env.example)}/vigie}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${VIGIE_SECRETS_DIR:-${NICEPHOS_DIR:?NICEPHOS_DIR obligatoire (voir env.example)}/vigie-secrets}
        target: /secrets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKUP_DIR:?BACKUP_DIR obligatoire (voir env.example)}
        target: /sauvegardes-site
        read_only: true
        bind:
          create_host_path: false
    logging: *logging
    mem_limit: 256m
    pids_limit: 128
    <<: *hardening

  # Sauvegarde quotidienne de la base de la Vigie (instantané contrôlé, 14 gardés), sans réseau ni secret.
  vigie-backup:
    image: ${VIGIE_IMAGE:-ghcr.io/volfieldd/deux-regards-vigie:latest}
    container_name: nicephos-vigie-sauvegarde
    profiles: [vigie]
    restart: unless-stopped
    command: ["node", "vigie/backup.js", "--loop"]
    environment:
      VIGIE_DATA_DIR: /data
      VIGIE_BACKUP_DIR: /backups
      VIGIE_BACKUP_KEEP: ${VIGIE_BACKUP_KEEP:-14}
    user: "${PUID:-99}:${PGID:-100}"
    network_mode: none
    healthcheck:
      disable: true
    volumes:
      - type: bind
        source: ${VIGIE_DATA_DIR:-${NICEPHOS_DIR:?NICEPHOS_DIR obligatoire (voir env.example)}/vigie}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${VIGIE_BACKUP_DIR:-${BACKUP_DIR:?BACKUP_DIR obligatoire (voir env.example)}-vigie}
        target: /backups
        bind:
          create_host_path: false
    logging: *logging
    mem_limit: 256m
    <<: *hardening

  # Passerelle Signal des alertes de la Vigie (facultative ; enregistrement du numéro : signal/README.md). Ne démarre
  # qu'avec le profil « signal » (COMPOSE_PROFILES=vigie,signal). Son API n'a AUCUNE authentification : aucun port
  # publié, joignable seulement par le réseau interne vigie-signal, où seule la Vigie la rejoint ; signal-sortie ne lui
  # sert qu'à sortir vers les serveurs de Signal.
  # DONNÉES : NICEPHOS_DIR/signal contient les clés du compte Signal ; il doit exister avant et appartenir à 1000:1000
  # (utilisateur de l'image), droits 700. Jamais dans un partage réseau, jamais dans les sauvegardes du site.
  signal:
    # Version épinglée par étiquette et empreinte (0.101, 25 septembre 2026).
    image: bbernhard/signal-cli-rest-api:0.101@sha256:2cf09d66a86fdd210e42ee91662216364acc27da1163a8c44167a77ea3a6559a
    container_name: nicephos-signal
    profiles: [signal]
    restart: unless-stopped
    environment:
      # Processus signal-cli permanent (binaire natif : démarrage rapide, mémoire modérée). Il reçoit en continu, ce que
      # Signal attend d'un compte (pas besoin d'AUTO_RECEIVE_SCHEDULE dans ce mode).
      MODE: json-rpc-native
      LOG_LEVEL: warn
      # Rien n'est attendu en réception : pièces jointes, stories et avatars ignorés.
      JSON_RPC_IGNORE_ATTACHMENTS: "true"
      JSON_RPC_IGNORE_STORIES: "true"
      JSON_RPC_IGNORE_AVATARS: "true"
    volumes:
      - type: bind
        source: ${SIGNAL_DATA_DIR:-${NICEPHOS_DIR:?NICEPHOS_DIR obligatoire (voir env.example)}/signal}
        target: /home/.local/share/signal-cli
        bind:
          create_host_path: false
    networks: [vigie-signal, signal-sortie]
    # Aucun port publié (API sans authentification). Les commandes d'enregistrement passent par « docker exec ».
    logging: *logging
    mem_limit: 512m
    pids_limit: 256
    # Durcie comme le reste, essayée le 18 octobre 2026 : l'image tourne sous 1000:1000 (s6 sans root) ; /run et /tmp
    # en mémoire lui appartiennent, et /tmp doit permettre l'exécution (signal-cli y décompresse sa bibliothèque native).
    read_only: true
    tmpfs:
      - /run:uid=1000,gid=1000,mode=0755,exec
      - /tmp:uid=1000,gid=1000,mode=1777,exec
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  traduction-modeles:
